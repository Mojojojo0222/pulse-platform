server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: pulse-api
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  version: ${APP_VERSION:1.0.0}
