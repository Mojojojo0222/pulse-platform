server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: pulse-api
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  version: ${APP_VERSION:1.0.0}

pulse:
  prometheus:
    base-url: ${PULSE_PROMETHEUS_URL:http://localhost:9090}
    connect-timeout-ms: ${PULSE_PROMETHEUS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PULSE_PROMETHEUS_READ_TIMEOUT_MS:5000}
    query-window: ${PULSE_PROMETHEUS_QUERY_WINDOW:5m}
  apps:
    todoapp:
      job: todoapp
